<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1433">
<title>Squishy Friends</title>
<style>
:root {
  --glass: rgba(24, 18, 48, 0.58);
  --glass-strong: rgba(24, 18, 48, 0.78);
  --line: rgba(255, 255, 255, 0.16);
  --text: #fff;
  --muted: rgba(255, 255, 255, 0.68);
  --accent: #ff8fb3;
  --accent2: #ffd36e;
  --good: #7be0a5;
  --bad: #ff7a8a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1433; color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.screen { position: absolute; inset: 0; pointer-events: none; transition: opacity .35s ease, transform .35s ease; }
.screen.hidden { opacity: 0; transform: scale(1.02); visibility: hidden; transition: opacity .3s ease, transform .3s ease, visibility 0s .3s; }
button { font: inherit; color: inherit; border: 0; background: none; pointer-events: auto; cursor: pointer; }
button:active { transform: scale(0.94); }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: 22px; }

/* ---------- select screen ---------- */
#select h1 { position: absolute; top: calc(var(--safe-top) + 22px); left: 0; right: 0; margin: 0; text-align: center; font-size: 30px; letter-spacing: .5px; font-weight: 800;
  text-shadow: 0 3px 18px rgba(0,0,0,.35); }
#select h1 small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.pick-panel { position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 18px); padding: 16px 16px 14px; text-align: center; pointer-events: auto; }
.pick-panel .nm { font-size: 26px; font-weight: 800; }
.pick-panel .lv { font-size: 13px; color: var(--accent2); font-weight: 700; margin-left: 6px; }
.pick-panel .bl { color: var(--muted); font-size: 14px; margin: 3px 0 10px; }
.pick-mood { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; min-height: 28px; }
.pill { padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 13px; font-weight: 700; }
.pill.warn { background: rgba(255,122,138,.28); }
.big { width: 100%; padding: 15px; border-radius: 18px; font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #ff8fb3, #ffb36e); color: #3a1230; box-shadow: 0 8px 22px rgba(255,120,150,.35); }
.arrow { position: absolute; top: 44%; width: 54px; height: 54px; border-radius: 50%; font-size: 30px; line-height: 1; pointer-events: auto; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.arrow.left { left: 10px; } .arrow.right { right: 10px; }
.chips { display: flex; justify-content: center; gap: 12px; margin: 0 0 12px; }
.chip { width: 56px; height: 56px; border-radius: 50%; font-size: 28px; position: relative; background: rgba(255,255,255,.1); border: 2px solid transparent; display: grid; place-items: center; }
.chip.on { border-color: var(--accent); background: rgba(255,143,179,.2); }
.chip .dot { position: absolute; right: 0; top: 0; width: 15px; height: 15px; border-radius: 50%; border: 2px solid #2a1d4d; background: var(--good); }
.chip .dot.mid { background: var(--accent2); } .chip .dot.low { background: var(--bad); }

/* ---------- play screen ---------- */
.top { position: absolute; top: calc(var(--safe-top) + 10px); left: 12px; right: 12px; display: flex; align-items: center; gap: 8px; }
.round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; pointer-events: auto; flex: none; }
.name-btn { flex: 1; height: 44px; border-radius: 22px; font-size: 18px; font-weight: 800; pointer-events: auto; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name-btn span { font-size: 12px; color: var(--accent2); margin-left: 6px; }
.meters { position: absolute; top: calc(var(--safe-top) + 62px); left: 12px; right: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 10px; }
.meter { display: flex; flex-direction: column; gap: 5px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.meter .ic { font-size: 19px; line-height: 1; transition: transform .3s; }
.meter.low .ic { animation: wiggle 1s infinite; }
.bar { width: 100%; height: 8px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 50%; border-radius: 6px; background: var(--good); transition: width .5s ease, background .5s ease; }
@keyframes wiggle { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

.dock { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 12px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 8px; }
.dock button { padding: 10px 4px 8px; border-radius: 16px; font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); transition: background .2s, color .2s; }
.dock button .e { font-size: 26px; line-height: 1.1; }
.dock button.on { background: rgba(255,143,179,.26); color: #fff; }

.sheet { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 100px); padding: 12px 12px 14px; pointer-events: auto; transform: translateY(24px); opacity: 0; visibility: hidden; transition: transform .3s ease, opacity .3s ease, visibility 0s .3s; }
.sheet.open { transform: none; opacity: 1; visibility: visible; transition: transform .3s ease, opacity .3s ease; }
.sheet h3 { margin: 0 0 8px; font-size: 14px; font-weight: 800; color: var(--muted); letter-spacing: .5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
.sheet h3 em { font-style: normal; font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 600; }

.foods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.food { padding: 10px 2px 8px; border-radius: 16px; background: rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; position: relative; touch-action: none; }
.food .e { font-size: 38px; line-height: 1.1; }
.food.fav::after { content: '♥'; position: absolute; right: 6px; top: 3px; color: var(--accent); font-size: 14px; }
.hint { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.tab { padding: 8px 2px 6px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
.tab .e { font-size: 24px; line-height: 1.1; }
.tab.on { background: rgba(255,143,179,.3); color: #fff; box-shadow: inset 0 0 0 2px var(--accent); }
.row { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 8px; margin: 9px 0; font-size: 14px; font-weight: 700; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; pointer-events: auto; touch-action: pan-x; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 10px; border-radius: 6px; background: rgba(255,255,255,.2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -9px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); border: 3px solid var(--accent); }
.swatches { display: flex; gap: 7px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); }
.sw.on { border-color: #fff; transform: scale(1.12); }
.sw.nat { background: conic-gradient(#ff8fb3, #ffd36e, #7be0a5, #6ec1ff, #c08bff, #ff8fb3); }
.action { margin-top: 6px; padding: 9px 14px; border-radius: 14px; background: rgba(255,255,255,.14); font-size: 14px; font-weight: 800; }

.bubble { position: absolute; transform: translate(-50%, -100%); padding: 8px 14px; border-radius: 18px; font-size: 16px; font-weight: 800; background: #fff; color: #3a2550; opacity: 0; transition: opacity .25s; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.bubble.on { opacity: 1; }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 3px; }

#fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.fly { position: absolute; font-size: 34px; will-change: transform, opacity; pointer-events: none; }
.float { position: absolute; font-size: 28px; will-change: transform, opacity; animation: floatUp 1.8s ease-out forwards; pointer-events: none; }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -150px) scale(1.1); opacity: 0; } }
.dragfood { position: fixed; font-size: 54px; z-index: 50; transform: translate(-50%, -62%); pointer-events: none; filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)); }

.toast { position: absolute; left: 50%; top: calc(var(--safe-top) + 126px); transform: translateX(-50%); padding: 8px 16px; border-radius: 16px; background: var(--glass-strong); border: 1px solid var(--line); font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.toast.on { opacity: 1; }

.modal { position: absolute; inset: 0; background: rgba(8,4,24,.6); display: none; align-items: center; justify-content: center; pointer-events: auto; }
.modal.on { display: flex; }
.modal .card { width: min(86vw, 340px); padding: 20px; text-align: center; }
.modal input[type=text] { width: 100%; font: inherit; font-size: 22px; font-weight: 800; text-align: center; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,255,255,.1); color: #fff; -webkit-user-select: text; user-select: text; outline: none; }
.modal .btns { display: flex; gap: 10px; margin-top: 14px; }
.modal .btns button { flex: 1; padding: 12px; border-radius: 14px; font-weight: 800; background: rgba(255,255,255,.14); }
.modal .btns button.ok { background: linear-gradient(135deg, #ff8fb3, #ffb36e); color: #3a1230; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <section id="select" class="screen">
    <h1>Squishy Friends<small>pick a buddy</small></h1>
    <button class="arrow left" id="prev" aria-label="previous">‹</button>
    <button class="arrow right" id="next" aria-label="next">›</button>
    <div class="pick-panel glass">
      <div class="chips" id="chips"></div>
      <div><span class="nm" id="pickName">Ember</span><span class="lv" id="pickLv"></span></div>
      <div class="bl" id="pickBlurb"></div>
      <div class="pick-mood" id="pickMood"></div>
      <button class="big" id="playBtn">Play</button>
    </div>
  </section>

  <section id="play" class="screen hidden">
    <div class="top">
      <button class="round glass" id="backBtn" aria-label="back">‹</button>
      <button class="name-btn glass" id="nameBtn">Ember <span id="lvTag"></span></button>
      <button class="round glass" id="soundBtn" aria-label="sound">🔊</button>
      <button class="round glass" id="hapticBtn" aria-label="vibration">📳</button>
    </div>
    <div class="meters glass" id="meters"></div>
    <div class="toast" id="toast"></div>
    <div class="bubble" id="bubble"></div>

    <div class="sheet glass" id="trayS">
      <h3>Snack time <em>drag a snack to the mouth, or tap it</em></h3>
      <div class="foods" id="foods"></div>
    </div>

    <div class="sheet glass" id="styleS">
      <div class="tabs" id="tabs"></div>
      <div id="sliders"></div>
      <div class="row"><span>Colour</span><div class="swatches" id="swatches"></div></div>
      <button class="action" id="reformBtn" style="display:none">✨ Smooth it out</button>
    </div>

    <nav class="dock glass">
      <button id="feedBtn"><span class="e">🍓</span>Feed</button>
      <button id="styleBtn"><span class="e">🎨</span>Style</button>
      <button id="sleepBtn"><span class="e">🌙</span>Sleep</button>
    </nav>
  </section>

  <div id="fx"></div>
  <div class="modal" id="renameM"><div class="card glass">
    <div style="font-weight:800;font-size:18px;margin-bottom:10px">Name your friend</div>
    <input type="text" id="renameIn" maxlength="14" autocomplete="off">
    <div class="btns"><button id="renameCancel">Cancel</button><button class="ok" id="renameOk">Save</button></div>
  </div></div>
</div>
<script>/*__JS__*/</script>
</body>
</html>
