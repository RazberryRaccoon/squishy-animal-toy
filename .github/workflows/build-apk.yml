name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bundle the game
        run: |
          npm ci
          node tools/build.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SquishyFriends.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SquishyFriends-apk
          path: SquishyFriends.apk

      - name: Publish a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Squishy Friends (build ${{ github.run_number }})
          body: |
            Download **SquishyFriends.apk** below and open it on the phone to install.
            If Android asks, allow "Install unknown apps" for your browser/Files app.
          files: SquishyFriends.apk
          make_latest: true
